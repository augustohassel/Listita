name: Deploy & Release

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && 'pages' || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Validate SemVer
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" && "$BASE_REF" == "master" ]]; then
            node scripts/check-version.mjs --require-bump
          elif [[ "$EVENT_NAME" != "pull_request" && "$REF_NAME" == "refs/heads/master" ]]; then
            node scripts/check-version.mjs --require-bump --allow-same-commit
          else
            node scripts/check-version.mjs
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          GITHUB_ACTIONS: true
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Registrar Release y Tag
    needs: [build, deploy]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Crear tag y release SemVer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          servidor="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"

          # Validar SemVer estricto y verificar si el tag ya apunta a este commit
          node scripts/check-version.mjs --require-bump --allow-same-commit
          version=$(node -p "require('./package.json').version")
          tag="v$version"

          existing_commit=$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)
          if [[ -n "$existing_commit" && "$existing_commit" == "$GITHUB_SHA" ]]; then
            echo "El tag \`$tag\` ya apunta al commit \`${GITHUB_SHA:0:7}\`; se omite la creación de un release duplicado." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          pulls_json=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls")
          pr=$(jq -r '.[0] // empty | "[#\(.number)](\(.html_url)) \(.title)"' <<< "$pulls_json")
          pr_num=$(jq -r '.[0].number // empty' <<< "$pulls_json")

          # Armar notas del release
          {
            echo "### 🚀 Listita \`$tag\`"
            echo
            echo "**Commit:** [\`${GITHUB_SHA:0:7}\`]($servidor/commit/$GITHUB_SHA)"
            echo "**PR:** ${pr:-sin PR (merge directo)}"
            echo "**Workflow:** [#$GITHUB_RUN_NUMBER]($servidor/actions/runs/$GITHUB_RUN_ID)"
            echo
            if [[ -n "$pr_num" ]]; then
              body=$(gh pr view "$pr_num" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // empty' 2>/dev/null || true)
              if [[ -n "$body" ]]; then
                echo "#### Resumen del Pull Request:"
                echo "$body"
              fi
            fi
          } > notas.md

          # Publicar tag y release en GitHub
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$tag" --notes-file notas.md

          echo "Release publicada con éxito: $tag" >> "$GITHUB_STEP_SUMMARY"
          cat notas.md >> "$GITHUB_STEP_SUMMARY"

