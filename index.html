<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("listita_theme");
          if (t === "light") {
            document.documentElement.classList.remove("dark");
          } else {
            document.documentElement.classList.add("dark");
          }
        } catch (_) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Listita" />
    <meta
      name="description"
      content="Tus listados, sus particularidades y tus rankings manuales con privacidad 100% local."
    />
    <title>Listita</title>
  </head>
  <body
    class="bg-base text-ink min-h-screen font-sans antialiased selection:bg-accent/30 selection:text-ink"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
